 --bg:#f3f3f3;--card:#fff;--panel:#fff;--txt:#2b2b2b;--mut:#777;--pri:#d9480f;--pri2:#ff9a00;--line:#e3e3e3;
 --ok:#25a244;--bad:#d9263a;--warn:#e8890c;--y:#ffc107;--shadow:0 2px 8px rgba(0,0,0,.16)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:15px}
:focus-visible{outline:3px solid #2f80ed;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:16px 14px 8px;min-height:60vh}

/* header */
header{position:sticky;top:0;z-index:30;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#ff8f00,#ffb300);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff}
.brand b{font-size:20px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--logo) center/cover no-repeat,#b3122a;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);flex:none;display:block}
.menu-btn{background:none;border:0;color:#fff;font-size:17px;font-weight:500;display:flex;align-items:center;gap:6px;padding:8px;cursor:pointer}
.menu-btn i{display:block;width:20px;height:14px;border-top:2px solid #fff;border-bottom:2px solid #fff;position:relative}
.menu-btn i::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:2px solid #fff}

/* drawer (#nav is filled by app.js) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(78%,340px);background:linear-gradient(180deg,#ff9100,#ffa626);z-index:50;transform:translateX(100%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 20px;overflow-y:auto}
.drawer.on{transform:none}
.drawer .dlogo{width:96px;height:96px;border-width:3px;margin:0 auto 14px}
.drawer .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;background:none;border:0;color:#fff;font-size:28px;line-height:1;cursor:pointer}
#nav{display:flex;flex-direction:column;gap:8px}
#nav a,#nav button{display:block;width:100%;text-align:left;text-decoration:none;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:8px;padding:11px 14px;font-size:15px;cursor:pointer}
#nav a.on{background:#fff;color:#444}
#nav a.bal{background:#fff7d6;color:#b36a00;font-weight:600}
#nav button{background:transparent;border:2px solid #fff;text-align:center;border-radius:99px;padding:8px}

/* hero */
.hero{position:relative;border-radius:10px;border:3px solid #e0402a;overflow:hidden;padding:18px 90px 18px 16px;margin-bottom:14px;min-height:130px;
 background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.55),transparent 30%),repeating-conic-gradient(from 0deg at 50% 130%,#ffd21a 0 7deg,#ffbf00 7deg 14deg);box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:24px;line-height:1.15;color:#fff;font-weight:700;text-shadow:-2px -2px 0 #7a1f00,2px -2px 0 #7a1f00,-2px 2px 0 #7a1f00,2px 2px 0 #7a1f00,0 4px 0 #7a1f00}
.hero p{margin:8px 0 0;font-size:13px;font-weight:600;color:#7a1f00}
.hero .big{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:60px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}

/* generic */
h2{font-size:20px;margin:0 0 8px;color:var(--pri);font-weight:600}
h3{margin:0;font-size:16px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
.panel{background:var(--panel);border-radius:10px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-weight:700;color:var(--bad);font-size:18px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #d9d9d9;border-radius:8px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);outline:none}
.row input{flex:1;min-width:0}
.btn{display:inline-block;border:0;border-radius:8px;padding:10px 18px;color:#fff;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;background:linear-gradient(180deg,#ffa31a,#ff8300);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.btn.g{background:#fff;color:#d98a00;border:1.5px solid #f5a700;box-shadow:none}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.red,.btn.r,.btn.d,.btn.danger{background:#dc3545}
.btn:disabled{opacity:.55;cursor:default}
.btn:active{transform:translateY(1px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border:2px solid #e8672b;border-radius:4px;font-weight:600;font-size:14px;color:#fff;cursor:pointer;white-space:nowrap;
 background:repeating-conic-gradient(from 0deg at 50% 130%,#ffd21a 0 8deg,#ffb800 8deg 16deg);text-shadow:-1px -1px 0 #8a2500,1px -1px 0 #8a2500,-1px 1px 0 #8a2500,1px 1px 0 #8a2500;box-shadow:0 2px 5px rgba(0,0,0,.25);opacity:.8}
.chip.on{opacity:1;outline:3px solid #fff;box-shadow:0 0 0 5px #e8672b}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 130%,#ffd21a 0 8deg,#ffbf00 8deg 16deg)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg .tag,.pimg .stk,.pimg .rnd,.pimg .cnt{position:absolute;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
.pimg .tag{top:6px;left:6px}.pimg .stk{bottom:6px;right:6px;background:#25a244}.pimg .rnd{bottom:6px;left:6px;background:#8e2b9c}.pimg .cnt{top:6px;right:6px}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pb h3{font-size:14px;line-height:1.25}
.pb p{margin:0;font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb .row{margin-top:auto;padding-top:6px}
.rev,.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.rev img{height:150px;border-radius:8px;cursor:pointer;flex:none}
.gal img{height:210px;border-radius:12px;flex:none;cursor:pointer}
.rndnote{background:#f6eaff;color:#6b2c91;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid #f5a700;background:#fff;color:#d98a00;font-size:18px;cursor:pointer}

/* modal / toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;color:var(--txt);border-radius:10px;width:100%;max-width:420px;padding:18px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:90;max-width:90%;text-align:center}

/* forms / topup / tables */
.auth{max-width:420px;margin:18px auto}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.amts button{padding:10px 0;border:1.5px solid #f5a700;border-radius:8px;background:#fff;color:#d98a00;font-weight:600;cursor:pointer}
.amts button.on{background:#ffa31a;color:#fff}
.qrbox{text-align:center;margin:12px 0}.qrbox img{max-width:240px;width:100%;border-radius:10px;border:3px solid #ffc107}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}
.st{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#eee;white-space:nowrap}
.st.pending{background:#fff1cc;color:#a36a00}.st.approved{background:#d9f5e0;color:#17803a}.st.rejected{background:#fde0e3;color:#b3122a}
.cred{margin-top:6px;padding:10px;background:#fff8dc;border:1px dashed #f5a700;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all}

footer{margin-top:20px;background:#8a96a3;color:#fff;text-align:center;padding:20px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px}
footer b{font-size:16px;font-weight:500}
footer .copy{margin-top:12px;opacity:.85;font-size:12px}
/* กล่องสุ่ม: จำกัดขนาดรูปไม่ให้ใหญ่เกิน */
#app img{max-width:100%;height:auto}
body[data-route="gacha"] #app img{max-width:100%;max-height:130px;width:auto;object-fit:contain;display:block;margin:0 auto}
body[data-route="gacha"] .md{overflow-x:hidden}
body[data-route="gacha"] .md *{max-width:100%}
body[data-route="gacha"] .md img{max-width:100%!important;width:72px!important;height:72px!important;object-fit:cover!important;border-radius:8px;display:inline-block!important;margin:4px!important;vertical-align:middle}
body[data-route="gacha"] .md img.gcover{width:auto!important;height:auto!important;max-height:150px!important;object-fit:contain!important;display:block!important;margin:0 auto 10px!important;border-radius:10px}
body[data-route="orders"] #app img{max-height:90px;width:auto;object-fit:contain}
body[data-route="admin"] #app img{max-height:90px;width:auto;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><span class="logo"></span><b>ปีโป้ช๊อป</b></a>
  <button class="menu-btn" id="mbtn" aria-label="เปิดเมนู"><i></i>เมนู</button>
</header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="เมนู">
  <button class="x" id="mclose" aria-label="ปิดเมนู">×</button>
  <div class="logo dlogo"></div>
  <nav id="nav"></nav>
</aside>

<main id="app" class="app"></main>

<footer>
  <b>ปีโป้ช๊อป</b><br>
  ร้านขายไอดี Free Fire · ส่งรหัสทันทีหลังชำระ · เติมเงินผ่าน TrueMoney
  <div class="copy">© ปีโป้ช๊อป</div>
</footer>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var d=document.getElementById('drawer'),s=document.getElementById('scrim');
  function open(){d.classList.add('on');s.classList.add('on')}
  function close(){d.classList.remove('on');s.classList.remove('on')}
  document.getElementById('mbtn').onclick=open;
  document.getElementById('mclose').onclick=close;
  s.onclick=close;
  document.getElementById('nav').addEventListener('click',function(e){if(e.target.closest('a,button'))close()});
  addEventListener('hashchange',close);
  function rt(){document.body.setAttribute('data-route',(location.hash||'#/').slice(2).split('/')[0])}
  rt();addEventListener('hashchange',rt);
  // ในป๊อปอัปกล่องสุ่ม: รูปแรก = ปก (ขนาดกลาง) รูปที่เหลือ = รางวัล/รหัสภาพ (ย่อเล็ก)
  var L=document.getElementById('layer');
  function fixImgs(){
    if(document.body.getAttribute('data-route')!=='gacha')return;
    var imgs=L.querySelectorAll('.md img');
    imgs.forEach(function(im,i){im.classList.toggle('gcover',i===0)});
  }
  new MutationObserver(fixImgs).observe(L,{childList:true,subtree:true});
  // กันหน้าว่าง: ถ้า app.js ไม่ได้เรียก render เอง ให้เรียกให้
  addEventListener('load',function(){
    setTimeout(function(){
      var a=document.getElementById('app');
      if(a && !a.children.length && typeof render==='function') render();
    },600);
  });
})();
</script>
</body>
</html>
